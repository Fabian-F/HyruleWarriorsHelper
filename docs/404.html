<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hyrule Warriors Helper</title>

  <script>
    const path = window.location.pathname;
    const basePath = '/HyruleWarriorsHelper/';
    const isV2 = path.startsWith(`${basePath}v2/`);

    sessionStorage.setItem(
      'github-pages-redirect',
      window.location.href
    );

    window.location.replace(
      isV2
        ? `${basePath}v2/`
        : basePath
    );
  </script>
</head>

<body></body>
</html>
