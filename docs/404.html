<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hyrule Warriors Helper</title>

  <script>
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    const basePath = '/HyruleWarriorsHelper/';
    const isV2 = path.startsWith(`${basePath}v2/`);

    const appBase = isV2
      ? `${basePath}v2/`
      : basePath;

    const route = path.slice(appBase.length);

    sessionStorage.setItem(
      'github-pages-redirect',
      JSON.stringify({
        route,
        search,
        hash
      })
    );

    window.location.replace(appBase);
  </script>
</head>

<body></body>
</html>
