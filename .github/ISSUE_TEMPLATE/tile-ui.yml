name: Tile UI bug
description: Report a display or interaction problem.
labels: [bug]
body:
  - type: textarea
    id: context
    attributes:
      label: Tile context
      description: Automatically filled when reporting from the app.
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Briefly describe the issue with this tile.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior (optional)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional)
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
