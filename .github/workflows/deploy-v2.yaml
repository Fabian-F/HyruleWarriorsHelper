name: Deploy V2 Beta

on:
  push:
    branches:
      - v2

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Build V2
        run: npm run build:ghpages

      - name: Prepare V2 build
        run: |
          rm -rf /tmp/v2-build
          cp -r dist/v2/browser /tmp/v2-build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Replace V2 deployment
        run: |
          rm -rf gh-pages/docs/v2
          mkdir -p gh-pages/docs/v2
          cp -r /tmp/v2-build/. gh-pages/docs/v2/

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/v2

          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi

          git commit -m "Deploy V2 beta"
          git push
