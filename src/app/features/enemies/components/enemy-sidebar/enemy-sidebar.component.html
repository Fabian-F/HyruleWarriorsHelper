<ng-template #picker>
  <div id="enemy-picker" class="picker-content">
    <h2>Enemies</h2>
    <label class="search-label" for="enemy-search">Search enemies or materials</label>
    <input
      id="enemy-search"
      #search
      type="search"
      placeholder="Enemy or material name..."
      [value]="query()"
      (input)="queryChange.emit(search.value)"
    />
    <div class="enemy-type-filters" role="group" aria-label="Enemy type">
      @for (option of categories; track option.id) {
        <button
          type="button"
          [attr.aria-pressed]="category() === option.id"
          (click)="categoryChange.emit(option.id)"
        >
          {{ option.name }}
        </button>
      }
    </div>
    <p class="picker-count" role="status">{{ enemies().length }} enemies</p>
    <div class="picker-list">
      @for (option of enemies(); track option.id) {
        <button
          type="button"
          class="picker-option"
          [class.selected]="enemy().id === option.id"
          [attr.aria-pressed]="enemy().id === option.id"
          (click)="sidebar.closePicker(); enemySelected.emit(option.id)"
        >
          <img [src]="enemySrc(option.id)" alt="" width="40" height="40" loading="lazy" />
          <span class="picker-name">{{ option.name }}</span>
          <span class="tiers" aria-label="Material tiers">
            <span
              class="bronze"
              [class.missing]="!option.drops?.bronze"
              [title]="option.drops?.bronze ? 'Bronze material' : 'No bronze material'"
              >B</span
            >
            <span
              class="silver"
              [class.missing]="!option.drops?.silver"
              [title]="option.drops?.silver ? 'Silver material' : 'No silver material'"
              >S</span
            >
            <span
              [class.missing]="!option.drops?.gold"
              [title]="option.drops?.gold ? 'Gold material' : 'No gold material'"
              >G</span
            >
          </span>
        </button>
      } @empty {
        <p class="empty">No enemies found. Try another name or type.</p>
      }
    </div>
  </div>
</ng-template>
<hwh-selection-sidebar
  #sidebar
  pickerId="enemy-picker"
  selectionLabel="Enemy selection"
  toggleLabel="Choose enemy"
  [selectedName]="enemy().name"
  [selectionKey]="enemy().id"
  [content]="picker"
/>
