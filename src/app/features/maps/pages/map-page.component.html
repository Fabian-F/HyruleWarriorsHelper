@if (mapDefinition.value(); as map) {
  <div
    class="map-container">
    <hwh-map-viewer
      [map]="map"
      [searchActive]="search.active()"
      [matchingTiles]="search.matches()"
      [focusedTileId]="focusedTileId()"
      (tileSelected)="openTileDetails($event)"
      (interactionStarted)="closeTileDetails()"
    />
    <router-outlet />
  </div>
  <hwh-map-toolbar [map]="map" />
} @else {
  no map provided
}
