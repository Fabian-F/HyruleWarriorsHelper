<div
  #viewport
  class="map-viewport"
  tabindex="0"
  (wheel)="onWheel($event)"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (dragstart)="$event.preventDefault()"
  (keydown)="onKeyDown($event)"
>
  <div
    #mapElement
    class="map"
    [class.map--snapping]="isSnapping()"
    [class.focused]="!!focusedTileId()"
    [style.--tile-width.px]="tileWidth()"
    [style.--columns]="getMapSize(map()).columns"
    [style.transform]="mapTransform()"
    (transitionend)="onSnapEnd($event)"
  >
    @for (tile of map().tiles; track tile.id) {
      @let tileCoordinates = getTileCoordinates(tile.id);
      <hwh-map-tile
        [class.search-miss]="searchActive() && !matchingTiles().has(tile.id)"
        [class.pixelated]="usePixelatedRendering()"
        [tile]="tile"
        [mapId]="map().id"
        [style.grid-row]="tileCoordinates.row + 1"
        [style.grid-column]="tileCoordinates.column + 1"
      />
    }
  </div>
</div>
<footer class="map-footer" aria-label="Map controls">
  <span class="map-footer__hints">
    Drag to pan · Scroll to zoom · Click for details
  </span>
  <button
    type="button"
    class="map-footer__fit"
    title="Fit the entire map to the viewport"
    (click)="fitMapToViewport()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
      <rect x="7" y="7" width="10" height="10" rx="1" />
    </svg>
    Reset Zoom
  </button>
</footer>
