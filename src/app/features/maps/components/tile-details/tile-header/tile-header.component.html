<div class="tile-details-headline">
  <span>{{ displayedTileId() }}</span>
  <span>
    Difficulty
    <span [style.color]="'var(--difficulty-' + tile().difficulty + ')'">{{ tile().difficulty }}</span>
  </span>
  @if (tile().isFinalBoss) {
    <span class="final-boss">Final Boss</span>
  }
</div>

<h1>{{ tile().challenge }}</h1>
